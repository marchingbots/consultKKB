<!doctype html>

<html lang="en" class="h-100">


<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Kapan Kita Bersama provides business consulting services for foreign investors and FDI in Indonesia.">

  <meta name="author" content="Kapan Kita Bersama">

  <meta name="robots" content="index, follow">

  <meta name="referrer" content="strict-origin-when-cross-origin">


  <meta property="og:title" content="Kapan Kita Bersama">

  <meta property="og:description" content="Business consulting services for foreign investors and FDI in Indonesia.">

  <meta property="og:type" content="website">

  <meta property="og:url" content="https://kapankitabersama.com/">

  <meta property="og:image" content="https://kapankitabersama.com/KKBlogo.png">

  <meta property="og:site_name" content="Kapan Kita Bersama">


  <meta name="twitter:card" content="summary_large_image">

  <meta name="twitter:title" content="Kapan Kita Bersama">

  <meta name="twitter:description" content="Business consulting services for foreign investors in Indonesia.">

  <meta name="twitter:image" content="https://kapankitabersama.com/KKBlogo.png">


  <title>Kapan Kita Bersama</title>


  <link rel="icon" href="KKBlogo.png" type="image/png">

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="canonical" href="https://kapankitabersama.com/">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles11.css">


  <script type="application/ld+json">

    {

      "@context": "https://schema.org",

      "@type": "ProfessionalService",

      "name": "Kapan Kita Bersama",

      "image": "https://www.kapankitabersama.com/KKBlogo.png",

      "url": "https://kapankitabersama.com",

      "description": "Business consulting firm in Bali for foreigners and foreign direct investment in Indonesia.",

      "serviceType": "Management Consulting",

      "areaServed": "Indonesia"

    }

  </script>

</head>


<body class="d-flex flex-column min-vh-100 text-white bg-dark">

  <div id="intro-screen" aria-hidden="true">

    <h1>When we are together.</h1>

  </div>


  <main class="site-main flex-fill">

    <section class="brand-hero d-flex align-items-center">

      <div class="container text-center">

        <h1 class="hero-heading mb-0">

          <span class="hero-brand d-block">Kapan Kita Bersama</span>

          <span class="hero-tagline d-block">Realize your FDI goals in Indonesia.</span>

        </h1>


        <button

          class="btn btn-outline-light contact-btn"

          type="button"

          data-user="info"

          data-domain="kapankitabersama"

          data-tld="com">

          Contact Us

        </button>

      </div>

    </section>

  </main>


  <footer class="site-footer py-4">

    <div class="container">

      <ul class="nav justify-content-center flex-column flex-sm-row text-center gap-2 gap-sm-4">

        <li class="nav-item">

          <a href="#" class="nav-link">About</a>

        </li>

        <li class="nav-item">

          <a href="#" class="nav-link">Privacy</a>

        </li>

        <li class="nav-item">

          <a href="#" class="nav-link">Legal</a>

        </li>

        <li class="nav-item">

          <a

            href="#"

            class="nav-link contact-link"

            data-user="info"

            data-domain="kapankitabersama"

            data-tld="com">

            Contact

          </a>

        </li>

      </ul>

    </div>

  </footer>


  <script>

    window.addEventListener("load", () => {

      const intro = document.getElementById("intro-screen");


      if (!intro) return;


      window.setTimeout(() => {

        intro.classList.add("is-hidden");

      }, 850);


      window.setTimeout(() => {

        intro.remove();

      }, 1750);

    });


    document.querySelectorAll("[data-user][data-domain][data-tld]").forEach((contactTrigger) => {

      contactTrigger.addEventListener("click", (event) => {

        event.preventDefault();


        const { user, domain, tld } = contactTrigger.dataset;

        window.location.href = `mailto:${user}@${domain}.${tld}`;

      });

    });

  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>


</html>
